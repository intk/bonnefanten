name: Codex frontend candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact tested source commit from this repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-frontend-candidate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: source
      - name: Resolve immutable source and candidate tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git -C source rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=intkbv/bonnefanten-frontend:codex-$revision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Reject credential files before building a public image
        run: |
          python3 - <<'PYSCAN'
          from pathlib import Path
          import re
          bad=[]
          for p in Path('source/frontend').rglob('*'):
              if not p.is_file(): continue
              if (p.name.startswith('.env') and not p.name.endswith(('.example','.sample'))) or p.suffix in ('.pem','.key'):
                  bad.append(str(p)); continue
              data=p.read_bytes()
              if re.search(rb'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b|-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----',data):
                  bad.append(str(p))
          if bad: raise SystemExit('Review credential-like files before publishing: '+', '.join(bad))
          PYSCAN
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux production candidate
        uses: docker/build-push-action@v6
        with:
          context: source/frontend
          file: tooling/frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production output and run frontend unit suite
        env:
          CANDIDATE: ${{ steps.source.outputs.tag }}
        run: |
          set -eu
          docker run --rm --env CI=true --entrypoint sh "$CANDIDATE" -c 'test -s build/server.js && node --check build/server.js && yarn test --watchAll=false --runInBand'
      - name: Sign in to existing Docker Hub image repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish unique candidate and record immutable digest
        env:
          CANDIDATE: ${{ steps.source.outputs.tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          docker push "$CANDIDATE"
          docker image inspect "$CANDIDATE" --format '{{json .RepoDigests}}' > digests.json
          python3 - <<'PY'
          import json, os
          metadata = {'source_revision':os.environ['SOURCE_REVISION'],
                      'tag':os.environ['CANDIDATE'], 'digests':json.load(open('digests.json')),
                      'deployed':False, 'requires_fix_specific_validation_before_deployment':True}
          json.dump(metadata,open('candidate.json','w'),indent=2)
          print(json.dumps(metadata,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-candidate
          path: candidate.json
